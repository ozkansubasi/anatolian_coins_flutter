org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# org.gradle.java.home BILEREK YOK: makineye ozgu bir yol buraya yazilirsa (ornegin
# Windows'taki Android Studio JBR yolu) o makine disinda her derleme "Java home supplied
# is invalid" ile duser. Gradle JDK'yi JAVA_HOME'dan alir; Flutter da `flutter config
# --jdk-dir` degerini gecer. Mac'te kurulum: brew install openjdk@17 ->
# flutter config --jdk-dir /opt/homebrew/opt/openjdk@17
