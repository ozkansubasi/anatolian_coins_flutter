name: anatolian_coins
description: Anatolian Coins (NumisTR-backed) mobile app with OIDC login (PKCE).
publish_to: "none"
version: 0.5.2+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  go_router: ^14.2.0
  cached_network_image: ^3.3.1
  intl: ^0.20.0
  flutter_secure_storage: ^9.2.2
  flutter_appauth: ^6.0.2
  url_launcher: ^6.3.1

  # Yeni eklenenler
  share_plus: ^10.0.2              # Paylaşma
  path_provider: ^2.1.4            # Dosya yolu
  flutter_cache_manager: ^3.4.1   # Gelişmiş cache
  sqflite: ^2.3.3                  # Çevrimdışı veritabanı
  path: ^1.9.0                     # Dosya yolu yardımcıları
  permission_handler: ^11.3.1     # İzinler (çevrimdışı için)

  # Camera & Recognition
  camera: ^0.10.5+9                # Kamera erişimi
  image_picker: ^1.0.7             # Galeri seçimi
  image: ^4.1.7                    # Image manipulation
  flutter_image_compress: ^2.2.0   # Sıkıştırma
  crop_your_image: ^1.0.2          # Crop/rotate

  # Articles/Blog
  flutter_html: ^3.0.0-beta.2      # HTML rendering for articles
  shared_preferences: ^2.5.3

  # UI Enhancement
  google_fonts: ^6.2.1             # Professional typography

  # In-App Purchases
  purchases_flutter: ^10.10.1        # RevenueCat SDK

  # ProKit UI System
  nb_utils: ^7.1.7                 # ProKit core utilities (extensions, widgets)
  flutter_staggered_grid_view: ^0.7.0  # Grid layouts
  photo_view: ^0.15.0              # Pinch-to-zoom gallery
  smooth_page_indicator: ^1.2.0    # Page indicators
  flutter_rating_bar: ^4.0.1       # Rating stars

  # Maps
  flutter_map: ^6.1.0              # OpenStreetMap based map widget
  latlong2: ^0.9.1                 # Latitude/Longitude support
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/regions/
    # Ana sayfa banner gorselleri. Kaynak: Bibliotheque nationale de France,
    # Domaine public (ticari kullanima acik; bkz. ADR-008 lisans haritasi).
    # coin_tanima.jpg  = Milet elektron, aslan basi (image_id 10317)
    # coin_bilgi.jpg   = Nikomedia gumus, portre (image_id 27580)
    - assets/images/banners/
    - assets/icon/
    - assets/data/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#8B7500"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21